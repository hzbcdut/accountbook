name: Release

on:
  push:
    tags:
      - 'v*'
  # 手动 trigger,便于在 tag push startup_failure 时手动跑一遍看真实日志。
  workflow_dispatch:

# 不要在打 tag 时和并发 build 抢资源。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # 用来创建 GitHub Release

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          # 把 v0.2.0 -> 0.2.0 用于 APK 命名
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Inject stable debug keystore
        # v0.5.0+:CI 用的 debug.keystore 不再由 Gradle 自动生成(那个每次 run 都随机,
        # 不同 release 之间的 APK 签名不一致 → 用户必须卸装重装才能升级,数据会丢)。
        # 改成从 GitHub Actions secret `KEYSTORE_BASE64` 注入项目根 `keystore/debug.keystore`。
        # 本机 + CI 用同一个文件,签名跨 release 稳定。
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore/debug.keystore
          ls -la keystore/debug.keystore
          # 校验:必须能被 keytool 读出来且 alias 匹配
          keytool -list -keystore keystore/debug.keystore \
            -storepass android -alias androiddebugkey 2>&1 | grep -E "Alias name|创建日期"

      - name: Cache Gradle / Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK to include version
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/accountbook-${{ steps.version.outputs.version }}-debug.apk

      - name: Compute SHA256
        run: |
          cd app/build/outputs/apk/debug
          sha256sum accountbook-${{ steps.version.outputs.version }}-debug.apk | tee accountbook-${{ steps.version.outputs.version }}-debug.apk.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/debug/accountbook-${{ steps.version.outputs.version }}-debug.apk
            app/build/outputs/apk/debug/accountbook-${{ steps.version.outputs.version }}-debug.apk.sha256
          body: |
            ## 自动构建产物

            此 Release 由 GitHub Actions 在 push tag `${{ steps.version.outputs.tag }}` 时自动生成。

            ### 验证指纹

            ```
            文件: accountbook-${{ steps.version.outputs.version }}-debug.apk
            SHA256: 见同目录 .sha256 文件
            ```

            ### 安装

            ```bash
            adb install accountbook-${{ steps.version.outputs.version }}-debug.apk
            ```

            ⚠️ debug APK 使用 Android Studio 默认 debug keystore 签名。正式发布前请在 `app/build.gradle.kts` 替换为真实 keystore。